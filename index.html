<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acil Servis Nöbet Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0f172a; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #calendar { background: white; padding: 15px; border-radius: 12px; }
        .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">🏥 Acil Servis Nöbet Portalı</a>
            <div id="userSection"></div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- GİRİŞ EKRANI -->
        <div id="loginCard" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h4 class="text-center mb-4 font-weight-bold">Sisteme Giriş</h4>
                    <div class="mb-3">
                        <label class="form-label">Hekim / Yönetici</label>
                        <select id="loginDoctorSelect" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="****">
                    </div>
                    <button onclick="login()" class="btn btn-primary w-100">Giriş Yap</button>
                </div>
            </div>
        </div>

        <!-- ANA PANEL -->
        <div id="mainApp" style="display: none;">
            
            <!-- YÖNETİCİ PANELİ -->
            <div id="adminPanel" class="card p-3 mb-4 bg-warning-subtle border-warning" style="display: none;">
                <h6 class="fw-bold text-dark mb-3">🛠️ Yönetici Kontrol Paneli</h6>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small">Canlı Ek Mesai Limiti</label>
                        <div class="input-group">
                            <input type="number" id="adminLimitInput" class="form-control" value="3">
                            <button onclick="updateLimit()" class="btn btn-warning">Güncelle</button>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label small">Hekime Asli/Rutin Nöbet Ekle</label>
                        <div class="row g-2">
                            <div class="col-md-5">
                                <select id="mainDutyDoctor" class="form-select"></select>
                            </div>
                            <div class="col-md-4">
                                <input type="date" id="mainDutyDate" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <button onclick="addMainDuty()" class="btn btn-success w-100">Rutin Nöbet Ekle</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DÜZEN & TAKVİM -->
            <div class="row g-4">
                <div class="col-md-4">
                    <!-- EK MESAİ EKLEME FORMU -->
                    <div class="card p-4 mb-3">
                        <h5 class="fw-bold mb-3">➕ Ek Mesai Al</h5>
                        <div class="mb-3">
                            <label class="form-label">Tarih</label>
                            <input type="date" id="shiftDate" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alan</label>
                            <select id="shiftArea" class="form-select">
                                <option value="Sarı Alan">Sarı Alan</option>
                                <option value="Kırmızı Alan">Kırmızı Alan</option>
                                <option value="Yeşil Alan">Yeşil Alan</option>
                                <option value="Triyaj">Triyaj</option>
                                <option value="Resüsitasyon">Resüsitasyon</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Süre</label>
                            <select id="shiftDuration" class="form-select">
                                <option value="8">8 Saat</option>
                                <option value="16">16 Saat</option>
                                <option value="24">24 Saat</option>
                            </select>
                        </div>
                        <button onclick="addShift()" class="btn btn-primary w-100">Takvime Ekle</button>
                    </div>

                    <!-- BİLGİ KUTUSU -->
                    <div class="card p-3 bg-light">
                        <h6>📌 Takvim Renk Kodları</h6>
                        <span class="badge bg-secondary mb-1">Grey: Rutin Nöbetler</span>
                        <span class="badge bg-primary">Blue: Ek Mesailer</span>
                    </div>
                </div>

                <!-- TAKVİM GÖRÜNÜMÜ -->
                <div class="col-md-8">
                    <div class="card p-3">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL (Şifre Değiştir) -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Şifre Değiştir</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="password" id="oldPasswordInput" class="form-control mb-2" placeholder="Eski Şifre">
                    <input type="password" id="newPasswordInput" class="form-control" placeholder="Yeni Şifre">
                </div>
                <div class="modal-footer">
                    <button onclick="changePassword()" class="btn btn-success">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        let calendar = null;

        async function init() {
            const res = await fetch('/api/doctors');
            const doctors = await res.json();
            
            document.getElementById('loginDoctorSelect').innerHTML = doctors.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            document.getElementById('mainDutyDoctor').innerHTML = doctors.filter(d => d.role !== 'admin').map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        }

        async function login() {
            const doctor_id = document.getElementById('loginDoctorSelect').value;
            const password = document.getElementById('loginPassword').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doctor_id, password })
            });

            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                
                document.getElementById('userSection').innerHTML = `
                    <span class="text-white me-3">👤 ${currentUser.name}</span>
                    ${currentUser.role !== 'admin' ? '<button class="btn btn-sm btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#passwordModal">🔑 Şifre Değiştir</button>' : ''}
                    <button onclick="location.reload()" class="btn btn-sm btn-danger">Çıkış</button>
                `;

                if (currentUser.role === 'admin') {
                    document.getElementById('adminPanel').style.display = 'block';
                }

                initCalendar();
            } else {
                alert(data.error);
            }
        }

        async function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            
            // Verileri Çek
            const [shiftsRes, dutiesRes] = await Promise.all([
                fetch('/api/shifts'),
                fetch('/api/main-duties')
            ]);

            const shifts = await shiftsRes.json();
            const duties = await dutiesRes.json();

            // Etkinlikleri Dönüştür
            const events = [
                ...duties.map(d => ({
                    title: `📋 ${d.doctor_name} (Rutin)`,
                    start: d.duty_date,
                    color: '#6c757d'
                })),
                ...shifts.map(s => ({
                    title: `⚡ ${s.doctor_name} (${s.area} - ${s.duration}Sa)`,
                    start: s.shift_date,
                    color: '#0d6efd'
                }))
            ];

            if (calendar) calendar.destroy();

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'tr',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: ''
                },
                events: events
            });

            calendar.render();
        }

        async function addShift() {
            const shift_date = document.getElementById('shiftDate').value;
            const area = document.getElementById('shiftArea').value;
            const duration = document.getElementById('shiftDuration').value;

            if (!shift_date) return alert("Tarih seçiniz!");

            const res = await fetch('/api/shift/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doctor_id: currentUser.id, shift_date, area, duration })
            });

            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) initCalendar();
        }

        async function addMainDuty() {
            const doctor_id = document.getElementById('mainDutyDoctor').value;
            const duty_date = document.getElementById('mainDutyDate').value;

            if (!duty_date) return alert("Tarih seçiniz!");

            const res = await fetch('/api/admin/add-main-duty', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doctor_id, duty_date })
            });

            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) initCalendar();
        }

        async function updateLimit() {
            const newLimit = document.getElementById('adminLimitInput').value;
            const res = await fetch('/api/admin/set-limit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newLimit })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function changePassword() {
            const oldPassword = document.getElementById('oldPasswordInput').value;
            const newPassword = document.getElementById('newPasswordInput').value;

            const res = await fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doctor_id: currentUser.id, oldPassword, newPassword })
            });

            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) bootstrap.Modal.getInstance(document.getElementById('passwordModal')).hide();
        }

        init();
    </script>
</body>
</html>
